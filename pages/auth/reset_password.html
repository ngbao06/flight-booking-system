<form id="resetForm">
    <h2>Đổi mật khẩu mới</h2>
    <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" required>
    <button type="submit">Xác nhận</button>
</form>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token'); // Lấy token từ URL

    document.getElementById('resetForm').onsubmit = async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;

        // Gọi tới đúng route API bạn đã định nghĩa trong auth.routes.js
        const response = await fetch('http://localhost:3000/api/auth/password/reset-confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: newPassword })
        });

        const result = await response.json();
        if (result.success) {
            alert('Đổi mật khẩu thành công!');
            window.location.href = '/login.html';
        } else {
            alert('Lỗi: ' + result.message);
        }
    };
</script>
