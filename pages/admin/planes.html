<div class="page-content" id="planes-page">
  <div id="planes-alert"></div>
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="fp-card h-100" style="position:relative;">
        <div class="fp-card-header">
          <span class="fp-card-title"><i class="fa-solid fa-jet-fighter-up"></i> Danh sách máy bay</span>
          <button class="fp-btn fp-btn-outline fp-btn-sm" id="planes-refresh-btn">
            <i class="fa-solid fa-rotate-right"></i> Làm mới
          </button>
        </div>
        <div class="table-responsive">
          <table class="table fp-table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Airline ID</th>
                <th>Model</th>
                <th>Tổng ghế</th>
                <th>Trạng thái</th>
                <th class="text-end">Thao tác</th>
              </tr>
            </thead>
            <tbody id="planes-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4 d-flex flex-column gap-3">
      <div class="fp-card">
        <div class="fp-card-header">
          <span class="fp-card-title"><i class="fa-solid fa-pen-to-square"></i> Cập nhật máy bay</span>
        </div>
        <div class="fp-card-body p-3">
          <form id="planes-edit-form" class="vstack gap-2">
            <input type="hidden" id="planes-edit-id">
            <div>
              <label class="fp-label">Airline ID</label>
              <input class="fp-input" id="planes-edit-airline-id" type="number" placeholder="Airline ID" required>
            </div>
            <div>
              <label class="fp-label">Model</label>
              <input class="fp-input" id="planes-edit-model" placeholder="Model" required>
            </div>
            <div>
              <label class="fp-label">Tổng ghế</label>
              <input class="fp-input" id="planes-edit-total-seats" type="number" placeholder="Tổng ghế" required>
            </div>
            <div>
              <label class="fp-label">Trạng thái</label>
              <select class="fp-select" id="planes-edit-status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="MAINTENANCE">MAINTENANCE</option>
                <option value="GROUNDED">GROUNDED</option>
                <option value="RETIRED">RETIRED</option>
              </select>
            </div>
            <div class="d-grid gap-2 mt-2">
              <button class="fp-btn fp-btn-primary" type="submit">Lưu thay đổi</button>
              <button class="fp-btn fp-btn-danger-ghost" type="button" id="planes-delete-btn">Xóa máy bay</button>
            </div>
          </form>
        </div>
      </div>

      <div class="fp-card">
        <div class="fp-card-header">
          <span class="fp-card-title"><i class="fa-solid fa-circle-plus"></i> Đăng ký máy bay</span>
        </div>
        <div class="fp-card-body p-3">
          <form id="planes-create-form" class="vstack gap-2">
            <div>
              <label class="fp-label">Airline ID</label>
              <input class="fp-input" id="planes-create-airline-id" type="number" placeholder="Airline ID" required>
            </div>
            <div>
              <label class="fp-label">Model</label>
              <input class="fp-input" id="planes-create-model" placeholder="Model" required>
            </div>
            <div>
              <label class="fp-label">Tổng ghế</label>
              <input class="fp-input" id="planes-create-total-seats" type="number" placeholder="Tổng ghế" required>
            </div>
            <div>
              <label class="fp-label">Trạng thái</label>
              <select class="fp-select" id="planes-create-status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="MAINTENANCE">MAINTENANCE</option>
                <option value="GROUNDED">GROUNDED</option>
                <option value="RETIRED">RETIRED</option>
              </select>
            </div>
            <button class="fp-btn fp-btn-success" type="submit">Tạo máy bay</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
