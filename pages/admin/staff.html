<div class="page-content" id="staff-page">
	<div id="staff-alert"></div>
	<div class="row g-3">
		<div class="col-lg-8">
			<div class="fp-card h-100" style="position:relative;">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-user-tie"></i> Danh sách nhân viên (Admin/Gate Agent)</span>
					<button class="fp-btn fp-btn-outline fp-btn-sm" id="staff-refresh-btn">
						<i class="fa-solid fa-rotate-right"></i> Làm mới
					</button>
				</div>
				<div class="table-responsive">
					<table class="table fp-table align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>ID</th>
								<th>Username</th>
								<th>Họ tên</th>
								<th>Role</th>
								<th>Email</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="staff-table-body"></tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="col-lg-4 d-flex flex-column gap-3">
			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-pen-to-square"></i> Cập nhật nhân viên</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="staff-edit-form" class="vstack gap-2">
						<input type="hidden" id="staff-edit-id">
						<div>
							<label class="fp-label">Họ tên</label>
							<input class="fp-input" id="staff-edit-full-name" placeholder="Họ tên" required>
						</div>
						<div>
							<label class="fp-label">Email</label>
							<input class="fp-input" id="staff-edit-email" placeholder="Email" type="email">
						</div>
						<div>
							<label class="fp-label">Số điện thoại</label>
							<input class="fp-input" id="staff-edit-phone" placeholder="Số điện thoại">
						</div>
						<div>
							<label class="fp-label">Địa chỉ</label>
							<input class="fp-input" id="staff-edit-address" placeholder="Địa chỉ">
						</div>
						<div>
							<label class="fp-label">Role</label>
							<select class="fp-select" id="staff-edit-role">
								<option value="ADMIN">ADMIN</option>
								<option value="GATE_AGENT">GATE_AGENT</option>
							</select>
						</div>
						<div class="d-grid gap-2 mt-2">
							<button class="fp-btn fp-btn-primary" type="submit">Lưu thay đổi</button>
							<button class="fp-btn fp-btn-danger-ghost" type="button" id="staff-delete-btn">Xóa tài khoản</button>
						</div>
					</form>
				</div>
			</div>

			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-circle-plus"></i> Tạo Gate Agent</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="staff-create-form" class="vstack gap-2">
						<div>
							<label class="fp-label">Username</label>
							<input class="fp-input" id="staff-create-username" placeholder="Username" required>
						</div>
						<div>
							<label class="fp-label">Password</label>
							<input class="fp-input" id="staff-create-password" type="password" placeholder="Password" required>
						</div>
						<div>
							<label class="fp-label">Họ tên</label>
							<input class="fp-input" id="staff-create-full-name" placeholder="Họ tên" required>
						</div>
						<div>
							<label class="fp-label">Email</label>
							<input class="fp-input" id="staff-create-email" type="email" placeholder="Email">
						</div>
						<div>
							<label class="fp-label">Số điện thoại</label>
							<input class="fp-input" id="staff-create-phone" placeholder="Số điện thoại">
						</div>
						<button class="fp-btn fp-btn-success" type="submit">Tạo tài khoản</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
