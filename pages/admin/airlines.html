<div class="page-content" id="airlines-page">
	<div id="airlines-alert"></div>
	<div class="row g-3">
		<div class="col-lg-8">
			<div class="card shadow-sm border-0 h-100">
				<div class="card-header bg-white d-flex justify-content-between align-items-center">
					<h6 class="mb-0 fw-bold">Danh sách hãng hàng không</h6>
					<button class="btn btn-sm btn-outline-primary" id="airlines-refresh-btn">Làm mới</button>
				</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>ID</th>
								<th>Code</th>
								<th>Tên</th>
								<th>Trạng thái</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="airlines-table-body"></tbody>
					</table>
				</div>
				<div class="d-flex justify-content-between align-items-center pt-3 px-3 pb-3">
					<small id="airlines-pagination-info" class="text-muted"></small>
					<nav aria-label="pagination" id="airlines-pagination-nav"></nav>
				</div>
			</div>
		</div>

		<div class="col-lg-4 d-flex flex-column gap-3">
			<div class="card shadow-sm border-0">
				<div class="card-header bg-white"><h6 class="mb-0 fw-bold">Cập nhật hãng</h6></div>
				<div class="card-body">
					<form id="airlines-edit-form" class="vstack gap-2">
						<input type="hidden" id="airlines-edit-id">
						<input class="form-control" id="airlines-edit-code" placeholder="Code" required>
						<input class="form-control" id="airlines-edit-name" placeholder="Tên hãng" required>
						<select class="form-select" id="airlines-edit-status">
							<option value="ACTIVE">ACTIVE</option>
							<option value="LOCKED">LOCKED</option>
						</select>
						<div class="d-grid gap-2 mt-2">
							<button class="btn btn-primary" type="submit">Lưu thay đổi</button>
							<button class="btn btn-outline-danger" type="button" id="airlines-delete-btn">Xóa hãng</button>
						</div>
					</form>
				</div>
			</div>

			<div class="card shadow-sm border-0">
				<div class="card-header bg-white"><h6 class="mb-0 fw-bold">Đăng ký hãng mới</h6></div>
				<div class="card-body">
					<form id="airlines-create-form" class="vstack gap-2">
						<input class="form-control" id="airlines-create-code" placeholder="Code" required>
						<input class="form-control" id="airlines-create-name" placeholder="Tên hãng" required>
						<button class="btn btn-success" type="submit">Tạo hãng</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
