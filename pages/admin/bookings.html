<div class="page-content" id="bookings-page">
	<div id="bookings-alert"></div>
	<div class="row g-3">
		<div class="col-lg-8">
			<div class="fp-card h-100" style="position:relative;">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-credit-card"></i> Danh sách giao dịch booking</span>
					<button class="fp-btn fp-btn-outline fp-btn-sm" id="bookings-refresh-btn">
						<i class="fa-solid fa-rotate-right"></i> Làm mới
					</button>
				</div>
				<div class="table-responsive">
					<table class="table fp-table align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>ID</th>
								<th>Flight ID</th>
								<th>User ID</th>
								<th>Booking date</th>
								<th>Tổng tiền</th>
								<th>Trạng thái</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="bookings-table-body"></tbody>
					</table>
				</div>
				<div class="d-flex justify-content-between align-items-center pt-3 px-3 pb-3">
					<small id="bookings-pagination-info" class="text-muted" style="font-size:12px;"></small>
					<div id="bookings-pagination-nav" class="d-flex gap-1 flex-wrap"></div>
				</div>
			</div>
		</div>

		<div class="col-lg-4 d-flex flex-column gap-3">
			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-pen-to-square"></i> Cập nhật booking</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="bookings-edit-form" class="vstack gap-2">
						<input type="hidden" id="bookings-edit-id">
						<div>
							<label class="fp-label">Flight ID</label>
							<input class="fp-input" id="bookings-edit-flight-id" type="number" placeholder="Flight ID">
						</div>
						<div>
							<label class="fp-label">User ID</label>
							<input class="fp-input" id="bookings-edit-user-id" type="number" placeholder="User ID">
						</div>
						<div>
							<label class="fp-label">Booking date</label>
							<input class="fp-input" id="bookings-edit-date" type="datetime-local">
						</div>
						<div>
							<label class="fp-label">Tổng tiền</label>
							<input class="fp-input" id="bookings-edit-amount" type="number" placeholder="Tổng tiền">
						</div>
						<div>
							<label class="fp-label">Trạng thái</label>
							<select class="fp-select" id="bookings-edit-status">
								<option value="PENDING">PENDING</option>
								<option value="CONFIRMED">CONFIRMED</option>
								<option value="CANCELLED">CANCELLED</option>
								<option value="COMPLETED">COMPLETED</option>
							</select>
						</div>
						<button class="fp-btn fp-btn-primary mt-1" type="submit">Lưu thay đổi</button>
					</form>
				</div>
			</div>

			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-circle-plus"></i> Tạo booking</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="bookings-create-form" class="vstack gap-2">
						<div>
							<label class="fp-label">Flight ID</label>
							<input class="fp-input" id="bookings-create-flight-id" type="number" placeholder="Flight ID" required>
						</div>
						<div>
							<label class="fp-label">User ID</label>
							<input class="fp-input" id="bookings-create-user-id" type="number" placeholder="User ID" required>
						</div>
						<div>
							<label class="fp-label">Booking date</label>
							<input class="fp-input" id="bookings-create-date" type="datetime-local" required>
						</div>
						<div>
							<label class="fp-label">Tổng tiền</label>
							<input class="fp-input" id="bookings-create-amount" type="number" placeholder="Tổng tiền" required>
						</div>
						<button class="fp-btn fp-btn-success" type="submit">Tạo booking</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
