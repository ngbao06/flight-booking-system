<div class="page-content" id="airlines-page">
	<div id="airlines-alert"></div>
	<div class="row g-3">
		<div class="col-lg-8">
			<div class="fp-card h-100" style="position:relative;">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-building"></i> Danh sách hãng hàng không</span>
					<button class="fp-btn fp-btn-outline fp-btn-sm" id="airlines-refresh-btn">
						<i class="fa-solid fa-rotate-right"></i> Làm mới
					</button>
				</div>
				<div class="table-responsive">
					<table class="table fp-table align-middle mb-0">
						<thead>
							<tr>
								<th>ID</th>
								<th>Code</th>
								<th>Tên</th>
								<th>Trạng thái</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="airlines-table-body"></tbody>
					</table>
				</div>
				<div class="d-flex justify-content-between align-items-center pt-3 px-3 pb-3">
					<small id="airlines-pagination-info" class="text-muted" style="font-size:12px;"></small>
					<div id="airlines-pagination-nav" class="d-flex gap-1 flex-wrap"></div>
				</div>
			</div>
		</div>

		<div class="col-lg-4 d-flex flex-column gap-3">
			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-pen-to-square"></i> Cập nhật hãng</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="airlines-edit-form" class="vstack gap-2">
						<input type="hidden" id="airlines-edit-id">
						<div>
							<label class="fp-label">Code</label>
							<input class="fp-input" id="airlines-edit-code" placeholder="Code" required>
						</div>
						<div>
							<label class="fp-label">Tên hãng</label>
							<input class="fp-input" id="airlines-edit-name" placeholder="Tên hãng" required>
						</div>
						<div>
							<label class="fp-label">Trạng thái</label>
							<select class="fp-select" id="airlines-edit-status">
								<option value="ACTIVE">ACTIVE</option>
								<option value="LOCKED">LOCKED</option>
							</select>
						</div>
						<div class="d-grid gap-2 mt-2">
							<button class="fp-btn fp-btn-primary" type="submit">Lưu thay đổi</button>
							<button class="fp-btn fp-btn-danger-ghost" type="button" id="airlines-delete-btn">Xóa hãng</button>
						</div>
					</form>
				</div>
			</div>

			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-circle-plus"></i> Đăng ký hãng mới</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="airlines-create-form" class="vstack gap-2">
						<div>
							<label class="fp-label">Code</label>
							<input class="fp-input" id="airlines-create-code" placeholder="Code" required>
						</div>
						<div>
							<label class="fp-label">Tên hãng</label>
							<input class="fp-input" id="airlines-create-name" placeholder="Tên hãng" required>
						</div>
						<button class="fp-btn fp-btn-success" type="submit">Tạo hãng</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
