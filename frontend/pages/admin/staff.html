<div class="page-content" id="staff-page">
	<div id="staff-alert"></div>
	<div class="row g-3">
		<div class="col-lg-8">
			<div class="card shadow-sm border-0 h-100">
				<div class="card-header bg-white d-flex justify-content-between align-items-center">
					<h6 class="mb-0 fw-bold">Danh sách nhân viên (Admin/Gate Agent)</h6>
					<button class="btn btn-sm btn-outline-primary" id="staff-refresh-btn">Làm mới</button>
				</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>ID</th>
								<th>Username</th>
								<th>Họ tên</th>
								<th>Role</th>
								<th>Email</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="staff-table-body"></tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="col-lg-4 d-flex flex-column gap-3">
			<div class="card shadow-sm border-0">
				<div class="card-header bg-white"><h6 class="mb-0 fw-bold">Cập nhật nhân viên</h6></div>
				<div class="card-body">
					<form id="staff-edit-form" class="vstack gap-2">
						<input type="hidden" id="staff-edit-id">
						<input class="form-control" id="staff-edit-full-name" placeholder="Họ tên" required>
						<input class="form-control" id="staff-edit-email" placeholder="Email" type="email">
						<input class="form-control" id="staff-edit-phone" placeholder="Số điện thoại">
						<input class="form-control" id="staff-edit-address" placeholder="Địa chỉ">
						<select class="form-select" id="staff-edit-role">
							<option value="ADMIN">ADMIN</option>
							<option value="GATE_AGENT">GATE_AGENT</option>
						</select>
						<div class="d-grid gap-2 mt-2">
							<button class="btn btn-primary" type="submit">Lưu thay đổi</button>
							<button class="btn btn-outline-danger" type="button" id="staff-delete-btn">Xóa tài khoản</button>
						</div>
					</form>
				</div>
			</div>

			<div class="card shadow-sm border-0">
				<div class="card-header bg-white"><h6 class="mb-0 fw-bold">Tạo Gate Agent</h6></div>
				<div class="card-body">
					<form id="staff-create-form" class="vstack gap-2">
						<input class="form-control" id="staff-create-username" placeholder="Username" required>
						<input class="form-control" id="staff-create-password" type="password" placeholder="Password" required>
						<input class="form-control" id="staff-create-full-name" placeholder="Họ tên" required>
						<input class="form-control" id="staff-create-email" type="email" placeholder="Email">
						<input class="form-control" id="staff-create-phone" placeholder="Số điện thoại">
						<button class="btn btn-success" type="submit">Tạo tài khoản</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
