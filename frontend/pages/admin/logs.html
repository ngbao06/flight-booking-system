<div class="page-content" id="logs-page">
	<!-- <div id="logs-alert"></div> -->
	<div class="fp-card" style="position:relative;">
		<div class="fp-card-header">
			<span class="fp-card-title"><i class="fa-solid fa-scroll"></i> Nhật ký hệ thống</span>
			<button class="fp-btn fp-btn-outline fp-btn-sm" id="logs-refresh-btn">
				<i class="fa-solid fa-rotate-right"></i> Làm mới
			</button>
		</div>
		<div class="table-responsive">
			<div class="p-3 border-bottom d-flex gap-2 flex-wrap">
				<input id="logs-search" class="form-control form-control-sm" 
						placeholder="Search module / action / id..." style="max-width:220px">

				<select id="logs-filter-module" class="form-select form-select-sm" style="max-width:160px">
					<option value="">All Modules</option>
					<option value="flights">Flights</option>
					<option value="airlines">Airlines</option>
					<option value="airports">Airports</option>
				</select>

				<select id="logs-filter-action" class="form-select form-select-sm" style="max-width:160px">
					<option value="">All Actions</option>
					<option value="UPDATE">UPDATE</option>
					<option value="DELETE">DELETE</option>
					<option value="LOCK">LOCK</option>
					<option value="UNLOCK">UNLOCK</option>
				</select>
			</div>

			<table class="table fp-table align-middle mb-0">
				<thead class="table-light">
					<tr>
						<th>Thời gian</th>
						<th>Module</th>
						<th>ID</th>
						<th>Action</th>
						<th>Changes</th>
					</tr>
				</thead>
				<tbody id="logs-table-body"></tbody>
			</table>
		</div>
		<div class="d-flex justify-content-between align-items-center pt-3 px-3 pb-3">
			<small id="logs-pagination-info" class="text-muted" style="font-size:12px;"></small>
			<div id="logs-pagination-nav" class="d-flex gap-1 flex-wrap"></div>
		</div>
	</div>
</div>
