<div class="page-content" id="airports-page">
	<div id="airports-alert"></div>
	<div class="row g-3">
		<div class="col-lg-9">
			<div class="fp-card h-100" style="position:relative;">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-tower-control"></i> Danh sách sân bay</span>
					<button class="fp-btn fp-btn-outline fp-btn-sm" id="airports-refresh-btn">
						<i class="fa-solid fa-rotate-right"></i> Làm mới
					</button>
				</div>
				<div class="table-responsive">
					<table class="table fp-table align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>ID</th>
								<th>IATA</th>
								<th>Tên</th>
								<th>Thành phố</th>
								<th>Miền</th>
								<th>Trạng thái</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="airports-table-body"></tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="col-lg-3 d-flex flex-column gap-3">
			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-pen-to-square"></i> Cập nhật sân bay</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="airports-edit-form" class="vstack gap-2">
						<input type="hidden" id="airports-edit-id">
						<div>
							<label class="fp-label">IATA code</label>
							<input class="fp-input" id="airports-edit-iata" placeholder="IATA code" required>
						</div>
						<div>
							<label class="fp-label">Tên sân bay</label>
							<input class="fp-input" id="airports-edit-name" placeholder="Tên sân bay" required>
						</div>
						<div>
							<label class="fp-label">Thành phố</label>
							<input class="fp-input" id="airports-edit-city" placeholder="Thành phố" required>
						</div>
						<div>
							<label class="fp-label">Miền</label>
							<input class="fp-input" id="airports-edit-region" placeholder="Miền" required>
						</div>
						<div class="d-grid gap-2 mt-2">
							<button class="fp-btn fp-btn-primary" type="submit">Lưu thay đổi</button>
							<button class="fp-btn fp-btn-outline" type="button" id="airports-toggle-lock-btn">Khóa / mở khóa</button>
							<button class="fp-btn fp-btn-danger-ghost" type="button" id="airports-delete-btn">Xóa sân bay</button>
						</div>
					</form>
				</div>
			</div>

			<div class="fp-card">
				<div class="fp-card-header">
					<span class="fp-card-title"><i class="fa-solid fa-circle-plus"></i> Đăng ký sân bay</span>
				</div>
				<div class="fp-card-body p-3">
					<form id="airports-create-form" class="vstack gap-2">
						<div>
							<label class="fp-label">IATA code</label>
							<input class="fp-input" id="airports-create-iata" placeholder="IATA code" required>
						</div>
						<div>
							<label class="fp-label">Tên sân bay</label>
							<input class="fp-input" id="airports-create-name" placeholder="Tên sân bay" required>
						</div>
						<div>
							<label class="fp-label">Thành phố</label>
							<input class="fp-input" id="airports-create-city" placeholder="Thành phố" required>
						</div>
						<div>
							<label class="fp-label">Miền</label>
							<input class="fp-input" id="airports-create-region" placeholder="Miền" required>
						</div>
						<button class="fp-btn fp-btn-success" type="submit">Tạo sân bay</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
