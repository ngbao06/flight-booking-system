<div class="page-content" id="airports-page">
	<div id="airports-alert"></div>
	<div class="row g-3">
		<div class="col-lg-9">
			<div class="card shadow-sm border-0 h-100">
				<div class="card-header bg-white d-flex justify-content-between align-items-center">
					<h6 class="mb-0 fw-bold">Danh sách sân bay</h6>
					<button class="btn btn-sm btn-outline-primary" id="airports-refresh-btn">Làm mới</button>
				</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>ID</th>
								<th>IATA</th>
								<th>Tên</th>
								<th>Thành phố</th>
								<th>Miền</th>
								<th>Trạng thái</th>
								<th class="text-end">Thao tác</th>
							</tr>
						</thead>
						<tbody id="airports-table-body"></tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="col-lg-3 d-flex flex-column gap-3">
			<div class="card shadow-sm border-0">
				<div class="card-header bg-white"><h6 class="mb-0 fw-bold">Cập nhật sân bay</h6></div>
				<div class="card-body">
					<form id="airports-edit-form" class="vstack gap-2">
						<input type="hidden" id="airports-edit-id">
						<input class="form-control" id="airports-edit-iata" placeholder="IATA code" required>
						<input class="form-control" id="airports-edit-name" placeholder="Tên sân bay" required>
						<input class="form-control" id="airports-edit-city" placeholder="Thành phố" required>
						<input class="form-control" id="airports-edit-region" placeholder="Miền" required>
						<div class="d-grid gap-2 mt-2">
							<button class="btn btn-primary" type="submit">Lưu thay đổi</button>
							<button class="btn btn-outline-warning" type="button" id="airports-toggle-lock-btn">Khóa/Mở khóa</button>
							<button class="btn btn-outline-danger" type="button" id="airports-delete-btn">Xóa sân bay</button>
						</div>
					</form>
				</div>
			</div>

			<div class="card shadow-sm border-0">
				<div class="card-header bg-white"><h6 class="mb-0 fw-bold">Đăng ký sân bay</h6></div>
				<div class="card-body">
					<form id="airports-create-form" class="vstack gap-2">
						<input class="form-control" id="airports-create-iata" placeholder="IATA code" required>
						<input class="form-control" id="airports-create-name" placeholder="Tên sân bay" required>
						<input class="form-control" id="airports-create-city" placeholder="Thành phố" required>
						<input class="form-control" id="airports-create-region" placeholder="Miền" required>
						<button class="btn btn-success" type="submit">Tạo sân bay</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
