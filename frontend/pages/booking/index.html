<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nhập Thông Tin Hành Khách – BAirlines</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css"/>
  <link rel="stylesheet" href="../../assets/css/booking.css"/>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<nav id="topbar" class="d-flex flex-column align-items-stretch border-0">
  <div class=" w-100 bg-white w-100">
    <div class="flight-bar-inner" style="padding: 12px 0;">
      <div class="topbar-brand ms-5">
        <a href="./../../index.html"><i class="fa-solid fa-plane"></i> BAirlines</a>
      </div>
      <div class="topbar-right">
        <a href="./../../index.html#login" class="topbar-login">Đăng nhập</a> / <a href="#./../../index.html#register" class="topbar-login">Đăng ký</a>
      </div>
    </div>
  </div>

  <div class="flight-bar w-100">
      <div class="flight-bar-inner">
        <div class="fb-segment">
          <div>
            <div class="fb-iata" id="fb-origin-iata">SGN</div>
            <div class="fb-city" id="fb-origin-city">TP. Hồ Chí Minh</div>
          </div>
          <div class="fb-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>
          <div>
            <div class="fb-iata" id="fb-dest-iata">HAN</div>
            <div class="fb-city" id="fb-dest-city">Hà Nội</div>
          </div>
        </div>
        <div class="fb-segment">
          <div>
            <div class="fb-label">Chuyến đi</div>
            <div class="fb-val" id="fb-date">Th 7, 20 tháng 2</div>
          </div>
        </div>
        <div class="fb-segment">
          <div>
            <div class="fb-label">Hành khách</div>
            <div class="fb-val" id="fb-pax">1 <i class="fa-solid fa-user" style="font-size:12px;"></i></div>
          </div>

        <button class="fb-edit-btn ms-auto">
          <i class="fa-solid fa-cart-shopping"></i> THÔNG TIN ĐẶT CHỖ
        </button>
      </div>
  </div>
</nav>

  <!-- KHU VỰC LOAD NỘI DUNG MUA VÉ -->
  <main id="booking-content" style="min-height: 70vh;">
      <!-- Nội dung mua-ve.html sẽ được booking.js tải vào đây -->
  </main>

<div class="main">
  <!-- KHU VỰC LOAD FOOTER -->
  <div id="footer-container"></div>

</div>
<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Logic Script -->
<script src="./../../assets/js/booking/BOOKING.js"></script>

<!-- Script xử lý Rollback khi Điều hướng -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
      const BASE_API_URL = 'http://localhost:3000/api'; // Đổi lại port/domain nếu cần

      // 1. Quay về màn hình chính (Bấm Logo BAirlines) -> Rollback toàn bộ Saga
      $(document).on('click', '.topbar-brand a', async function(e) {
          e.preventDefault();
          const href = $(this).attr('href');
          
          const rawData = sessionStorage.getItem('selectedFlightBooking');
          if (rawData) {
              try {
                  const data = JSON.parse(rawData);
                  if (data.bookingId) {
                      await fetch(`${BASE_API_URL}/booking/${data.bookingId}/cancel`, { method: 'POST' });
                  }
              } catch (err) { console.error('Lỗi khi huỷ booking:', err); }
              sessionStorage.removeItem('selectedFlightBooking');
          }
          window.location.href = href; // Chuyển trang sau khi đã trigger API
      });

      // 2. Bấm nút Quay Lại (.btn-back) trên giao diện -> Xử lý theo từng trang
      $(document).on('click', '.btn-back', async function() {
          const currentStep = window.BookingSPA ? window.BookingSPA.currentStep : null;
          const rawData = sessionStorage.getItem('selectedFlightBooking');
          
          if (rawData && currentStep) {
              try {
                  const data = JSON.parse(rawData);
                  if (data.bookingId) {
                      if (currentStep === 'shopping-cart') {
                          // Đang ở shopping-cart bấm quay lại user-info: Hủy toàn bộ booking & nhả ghế (nếu có)
                          await fetch(`${BASE_API_URL}/booking/${data.bookingId}/cancel`, { method: 'POST' });
                          delete data.bookingId; // Xóa id để hàm Tiếp Tục tạo lại Booking mới
                          delete data.seatSummary;
                          sessionStorage.setItem('selectedFlightBooking', JSON.stringify(data));
                      } else {
                          // Ở các trang khác (seatmap, payment...): Rollback step gần nhất
                          await fetch(`${BASE_API_URL}/booking/${data.bookingId}/rollback-step`, { method: 'POST' });
                          if (currentStep === 'seatmap') {
                              delete data.seatSummary;
                              sessionStorage.setItem('selectedFlightBooking', JSON.stringify(data));
                          }
                      }
                  }
              } catch (err) { console.error('Lỗi khi rollback:', err); }
          }
      });

      // 3. Bấm nút Back của trình duyệt -> Rollback Step
      window.addEventListener('popstate', function() {
          // Trình duyệt back khó bắt chính xác route, an toàn nhất là gọi rollback-step. 
          // Backend sẽ tự phân tích và quyết định có hủy booking hay không.
          const rawData = sessionStorage.getItem('selectedFlightBooking');
          if (rawData) {
              try {
                  const data = JSON.parse(rawData);
                  if (data.bookingId) {
                      fetch(`${BASE_API_URL}/booking/${data.bookingId}/rollback-step`, { method: 'POST' })
                          .catch(err => console.error('Lỗi khi rollback step:', err));
                  }
              } catch (err) {}
          }
      });
  });
</script>

</body>
</html>
